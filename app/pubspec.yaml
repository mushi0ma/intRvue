name: intrvue
description: "intRvue — IT сұхбатына мәтінмен дайындалуға арналған Android қосымшасы."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  http: ^1.6.0
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  timezone: ^0.11.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Синхрондаудың e2e тесті серверді процесс ішінде іске қосады.
  intrvue_server:
    path: ../server
  postgres: ^3.5.20
  shelf: ^1.4.2
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Medeo (OFL 1.1, assets/fonts/Medeo-OFL.txt) — Figma v2 шрифті.
    - family: Medeo Sans
      fonts:
        - asset: assets/fonts/MedeoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MedeoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MedeoSans-SemiBold.ttf
          weight: 600
    - family: Medeo Sans Display
      fonts:
        - asset: assets/fonts/MedeoSansDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/MedeoSansDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/MedeoSansDisplay-Medium.ttf
          weight: 500
    - family: Medeo Mono
      fonts:
        - asset: assets/fonts/MedeoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/MedeoMono-Medium.ttf
          weight: 500
