name: intrvue
description: "intRvue — IT сұхбатына мәтінмен дайындалуға арналған Android қосымшасы."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  http: ^1.6.0
  path: ^1.9.1
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Синхрондаудың e2e тесті серверді процесс ішінде іске қосады.
  intrvue_server:
    path: ../server
  postgres: ^3.5.20
  shelf: ^1.4.2
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
